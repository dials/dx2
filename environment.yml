name: dx2
channels:
  - conda-forge
# Packages are pinned exactly so that a build only changes when this
# file does. The Conda update workflow proposes the bumps and leaves
# wildcard pins alone.
dependencies:
  - c-compiler=2.0.0
  - cxx-compiler=2.0.0
  - ccache=4.14.1
  - gemmi=0.7.5
  - cmake=4.4.5
  - hdf5=1.14.* # Held on 1.14; the move to 2.x is a migration made by hand
  - hdf5-external-filter-plugins=0.1.0
  - nlohmann_json=3.12.0
  - fmt=12.2.0
  - eigen=5.0.1
